services:
  app:
    build: .
    ports:
    - "4000:3000"
    environment:
    - PGUSER=${PGUSER}
    - PGHOST=${PGHOST}
    - PGDATABASE=${PGDATABASE}
    - PGPASSWORD=${PGPASSWORD}
    - PGPORT=${PGPORT}
    depends_on:
    - db
  db:
    image: postgres
    environment:
    - POSTGRES_PASSWORD=${PGPASSWORD}
    - POSTGRES_DB=${PGDATABASE}
    - POSTGRES_PORT=${PGPORT}
    ports:
      - "5432:5432"