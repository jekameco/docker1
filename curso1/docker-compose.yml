services:
  app:
    build: .
    ports:
    - "4000:3000"
    environment:
    - PGUSER=${PGUSER}
    - PGHOST=${PGHOST}
    - PGDATABASE=${PGDATABASE}
    - PGPASSWORD=${PGPASSWORD}
    - PGPORT=${PGPORT}
    depends_on:
    - db
  db:
    image: postgres
    environment:
    - POSTGRES_USER=${PGUSER:-postgres}
    - POSTGRES_PASSWORD=${PGPASSWORD:-postgres}
    - POSTGRES_DB=${PGDATABASE}
    ports:
      - "5432:5432"
    volumes:
      - ./data_sql:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
volumes:
  data_sql: